<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#ffe4ec,#fff5f8);
  overflow:hidden; color:#4a2631;
}
.card{
  width:min(90%,390px); padding:38px 25px; text-align:center;
  background:rgba(255,255,255,.88); border-radius:28px;
  box-shadow:0 20px 60px rgba(150,60,90,.18);
  position:relative; z-index:2;
}
.heart{font-size:48px; animation:pulse 1.4s infinite}
h1{font-size:25px;margin:12px 0 20px}
p{font-size:18px;line-height:1.6;margin:8px 0 25px}
.buttons{display:flex; flex-direction:column; gap:13px}
button{
  border:0; border-radius:16px; padding:15px 18px; font-size:16px;
  font-weight:700; cursor:pointer; transition:.2s;
}
.yes{background:#ff5f8f;color:white;box-shadow:0 8px 18px rgba(255,95,143,.25)}
.no{background:#f4e8ed;color:#694653}
button:active{transform:scale(.96)}
#result{display:none}
.emoji{font-size:55px}
.small{font-size:14px;opacity:.65;margin-top:20px}
.float{
  position:absolute; bottom:-40px; animation:float 7s linear infinite;
  opacity:.5; font-size:22px;
}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes float{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="card" id="question">
  <div class="heart">💌</div>
  <h1>HEYYY SAYANG!</h1>
  <p><b>Tanggal 4 hari Minggu ini kamu free ga?</b></p>
  <div class="buttons">
    <button class="yes" onclick="yes()">FREE DONG</button>
    <button class="no" id="noBtn" onclick="nope()">AKU UDAH ADA JANJI LAIN</button>
  </div>
  <div class="small">Ada yang mau ngajak kamu pergi nih... 👀</div>
</div>

<div class="card" id="result">
  <div class="emoji">🥰🎉</div>
  <h1>YEEEAY!</h1>
  <p>Berarti tanggal 4 kamu punya aku yaa ❤️<br><br>Jangan lupa kosongin waktunya hehe 😚</p>
  <div class="small">See you, sayang! ❤️</div>
</div>

<script>
function yes(){
  document.getElementById("question").style.display="none";
  document.getElementById("result").style.display="block";
  for(let i=0;i<20;i++){
    setTimeout(()=>{
      const e=document.createElement("div");
      e.className="float";
      e.textContent=["❤️","💕","💖","✨","🥰"][Math.floor(Math.random()*5)];
      e.style.left=Math.random()*100+"vw";
      e.style.animationDuration=(4+Math.random()*4)+"s";
      document.body.appendChild(e);
      setTimeout(()=>e.remove(),8000);
    },i*100);
  }
}
function nope(){
  const b=document.getElementById("noBtn");
  b.style.position="fixed";
  b.style.left=(10+Math.random()*65)+"%";
  b.style.top=(15+Math.random()*65)+"%";
  b.textContent=["😳 Eits, jangan itu!","🥺 Yakin?","😭 Kok pilih ini...","🙈 Coba lagi!"][Math.floor(Math.random()*4)];
}
</script>
</body>
</html>
